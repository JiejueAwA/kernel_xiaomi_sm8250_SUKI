
name: Xiaomi SM8250 Kernel Build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "构建模式"
        type: choice
        required: true
        default: all
        options:
          - all
          - single

      device:
        description: "指定机型（single 模式生效）"
        type: choice
        required: true
        default: psyche
        options:
          - psyche
          - thyme
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa

      target:
        description: "构建目标"
        type: choice
        required: true
        default: both
        options:
          - both
          - aosp
          - miui

      enable_ksu:
        description: "启用 SukiSU"
        type: boolean
        required: true
        default: true

      kernel_name:
        description: '自定义内核名称'
        required: false
        default: 'SukiSU'
        type: string

  push:
    branches:
      - android15-lineage22-mod
    paths:
      - 'build.sh'
      - 'arch/arm64/configs/**'
      - 'drivers/**'
      - 'kernel/**'
      - 'include/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.device }} - ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'both' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'single' && fromJSON(format('["{0}"]', inputs.device)) || fromJSON('["psyche","thyme","umi","munch","lmi","cmi","cas","apollo","alioth","elish","enuma","dagu","pipa"]') }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl wget \
            bison flex zip unzip bc cpio rsync \
            libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler python-is-python3 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Download Proton Clang
        run: |
          mkdir -p "$HOME/proton-clang"
          cd "$HOME/proton-clang"

          wget -q \
            https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip \
            -O proton-clang.zip

          unzip -q proton-clang.zip
          rm proton-clang.zip

          test -x proton-clang-20210522/bin/clang

      - name: Verify toolchain
        run: |
          export PATH="$HOME/proton-clang/proton-clang-20210522/bin:$PATH"
          clang --version
          aarch64-linux-gnu-ld --version
          arm-linux-gnueabi-ld --version

      - name: Build Kernel
        shell: bash
        run: |
          DEVICE="${{ matrix.device }}"
          TARGET="${{ inputs.target || 'both' }}"
          KERNEL_NAME="${{ inputs.kernel_name || 'SukiSU' }}"

          if [[ "${{ inputs.enable_ksu }}" == "true" ]]; then
            KSU_ARG="ksu"
          else
            KSU_ARG="none"
          fi

          bash build.sh "$DEVICE" "$KSU_ARG" "$TARGET" "$KERNEL_NAME"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ matrix.device }}
          path: |
            Kernel_AOSP_${{ matrix.device }}_*.zip
            Kernel_MIUI_${{ matrix.device }}_*.zip
            build.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
