
name: Xiaomi SM8250 Kernel Build

on:
  workflow_dispatch:
  push:
    branches:
      - android15-lineage22-mod
    paths:
      - 'build.sh'
      - 'arch/arm64/configs/**'
      - 'drivers/**'
      - 'kernel/**'
      - 'include/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.device }} (AOSP + MIUI)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device:
          - psyche
          - thyme
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git curl wget \
            bison flex \
            zip unzip \
            bc cpio rsync \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            python-is-python3 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Download Proton Clang
        run: |
          mkdir -p "$HOME/proton-clang"
          cd "$HOME/proton-clang"

          wget -q \
            https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip \
            -O proton-clang.zip

          unzip -q proton-clang.zip
          rm proton-clang.zip

          test -x proton-clang-20210522/bin/clang

      - name: Verify toolchain
        run: |
          export PATH="$HOME/proton-clang/proton-clang-20210522/bin:$PATH"

          clang --version
          aarch64-linux-gnu-ld --version
          arm-linux-gnueabi-ld --version

      - name: Build AOSP and MIUI with SukiSU
        shell: bash
        run: |
          set -o pipefail

          echo "=================================="
          echo "Device: ${{ matrix.device }}"
          echo "SukiSU: builtin"
          echo "Targets: AOSP + MIUI"
          echo "=================================="

          bash build.sh "${{ matrix.device }}" ksu 2>&1 | tee build.log

      - name: Upload kernel ZIPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ matrix.device }}
          path: |
            Kernel_AOSP_${{ matrix.device }}_*.zip
            Kernel_MIUI_${{ matrix.device }}_*.zip
            build.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
